<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Requiem</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/saves.css">
<link rel="stylesheet" href="css/touch.css">
<link rel="stylesheet" href="css/readability.css">
</head><body>

<div id="app">
  <!-- TITLE -->
  <section id="title" class="screen">
    <canvas id="titleCanvas"></canvas>
    <canvas id="title3d" hidden></canvas>
    <div class="titleInner">
      <div class="logo"><span class="logo-a">IRON</span><span class="logo-b">REQUIEM</span></div>
      <div class="tagline">A tactical mecha saga · Concord Year 0089</div>
      <div class="tmenu">
        <button id="btnNew" class="btn primary big">New Game</button>
        <button id="btnContinue" class="btn big">Continue</button>
        <button id="btnLoad" class="btn">Load Game</button>
        <button id="btnArchive" class="btn">Frame Archive</button>
        <button id="btnTitleSettings" class="btn">Settings</button>
      </div>
      <p class="tfoot">Mouse or touch. Right-click / Esc cancels. Click during battle scenes to fast-forward; Esc skips.</p>
    </div>
  </section>

  <!-- SETUP -->
  <section id="setup" class="screen" hidden>
    <div class="setupWrap">
      <div id="setupStep" class="eyebrow">New game · 1 of 2</div>
      <h2 id="setupTitle">Choose your pilot</h2>
      <div id="setupBody"></div>
    </div>
  </section>

  <!-- STORY -->
  <section id="story" class="screen" hidden>
    <canvas id="storyBg"></canvas>
    <div id="portL" class="port L"></div>
    <div id="portR" class="port R"></div>
    <div class="dlg" hidden>
      <div class="name"></div>
      <div class="text"></div>
      <div class="next">▼</div>
    </div>
    <div class="choices" hidden></div>
    <div class="storyCtl"><button id="btnLog" class="btn sm">Log</button><button id="btnAuto" class="btn sm">Auto</button><button id="btnSkip" class="btn sm">Skip</button></div>
    <div id="logPanel" hidden></div>
    <div id="titleCard" hidden></div>
    <div id="storyFlash"></div>
  </section>

  <!-- MAP -->
  <section id="mapScreen" class="screen" hidden>
    <header id="mapTop">
      <div id="mapTitle"></div>
      <div id="mapSize" aria-label="Map dimensions"></div>
      <div id="mapTurn"></div>
      <div id="mapPhase" class="phase"></div>
      <div id="mapEnemies" class="muted"></div>
      <div id="mapCredits" class="gold"></div>
      <div class="mtBtns">
        <button id="btnObj" class="btn sm">Objective</button>
        <button id="btnThreat" class="btn sm" title="Show every tile enemies can hit next phase (T)">Threat</button>
        <button id="btnMapMenu" class="btn sm">Menu</button>
        <button id="btnEnd" class="btn sm primary">End Turn</button>
      </div>
    </header>
    <div id="mapBody">
      <div id="mapWrap"><canvas id="mapCanvas"></canvas></div>
      <aside id="sidePanel"></aside>
    </div>
    <div id="actMenu" hidden></div>
    <div id="wpnPanel" hidden></div>
    <div id="forecast" hidden></div>
    <div id="phaseBanner" hidden></div>
  </section>

  <!-- BATTLE -->
  <section id="battle" class="screen" hidden>
    <canvas id="battle3d"></canvas>
    <canvas id="battleCanvas"></canvas>
    <div class="battleHint">Click / Space: fast-forward · Esc: skip</div>
  </section>

  <!-- INTERMISSION -->
  <section id="inter" class="screen" hidden></section>

  <div id="modal" class="modal" hidden></div>
  <div id="toast"></div>
</div>
<script src="js/data/types.js"></script>
<script src="js/data/mechs.js"></script>
<script src="js/data/pilots.js"></script>
<script src="js/data/story.js"></script>
<script src="js/data/expansion.js"></script>
<script src="js/data/combos.js"></script>
<script src="js/data/enemy-deployments.js"></script>
<script src="js/render/audio.js"></script>
<script src="js/render/mechart.js"></script>
<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/CopyShader.js"></script>
<script src="vendor/three/LuminosityHighPassShader.js"></script>
<script src="vendor/three/EffectComposer.js"></script>
<script src="vendor/three/MaskPass.js"></script>
<script src="vendor/three/RenderPass.js"></script>
<script src="vendor/three/ShaderPass.js"></script>
<script src="vendor/three/UnrealBloomPass.js"></script>
<script src="vendor/three/RoomEnvironment.js"></script>
<script src="js/render/quality.js"></script>
<script src="js/render/r3d.js"></script>
<script src="assets/art-metadata.js"></script>
<script src="js/render/assets.js"></script>
<script src="js/map/enemy-systems.js"></script>
<script src="js/battle/combat.js"></script>
<script src="js/battle/scene.js"></script>
<script src="js/map/tactics.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/saves.js"></script>
<script src="js/ui/touch.js"></script>
<script src="js/ui/archive.js"></script>
<script src="js/main.js"></script>

</body></html>
